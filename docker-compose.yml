version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bjp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bjp_database
    volumes:
      - bjp_pgdata:/var/lib/postgresql/data

volumes:
  bjp_pgdata:
